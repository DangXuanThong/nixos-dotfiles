general {
    # avoid starting multiple hyprlock instances
    lock_cmd = pidof hyprlock || hyprlock
    # lock before suspend
    before_sleep_cmd = loginctl lock-session
    # to avoid having to press a key twice to turn on the display
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 150                           # 2.5min
    # decrease monitor brightness in 1200ms with ease-in-out
    on-timeout = ~/.config/hypr/scripts/screen-fade.sh out 1200
    # restore monitor brightness in 150ms with ease-in-out
    on-resume = ~/.config/hypr/scripts/screen-fade.sh in 150
}

listener {
    timeout = 300                           # 5min
    on-timeout = loginctl lock-session      # lock screen when timeout has passed
}

listener {
    timeout = 330                           # 5.5min
    # screen off when timeout has passed
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    # screen on when activity is detected after timeout has fired
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 1800                          # 30min
    on-timeout = systemctl suspend          # suspend pc
}
